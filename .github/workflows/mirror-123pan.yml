name: Mirror to 123pan

on:
  workflow_dispatch:
    inputs:
      token:
        description: "123云盘Token（从 get-token.html 页面获取）"
        required: true
      force_all:
        description: "强制全部重新上传（忽略已镜像记录）"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install aria2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq aria2

      - name: Mirror new files to 123pan
        run: node scripts/mirror-to-123pan.js
        env:
          PAN123_TOKEN: ${{ github.event.inputs.token }}
          PAN123_FORCE_ALL: ${{ github.event.inputs.force_all }}

      - name: Commit mirrored index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: mirror new files to 123pan"
          file_pattern: |
            public/index.json
            public/.mirrored.json