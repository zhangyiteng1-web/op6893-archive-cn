name: Mirror to 123pan

on:
  workflow_dispatch:
    inputs:
      phone:
        description: "123云盘手机号（可选，如果只需用Token则留空）"
        required: false
      password:
        description: "123云盘密码（可选，如果只需用Token则留空）"
        required: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mirror new files to 123pan
        run: node scripts/mirror-to-123pan.js
        env:
          PAN123_PHONE: ${{ github.event.inputs.phone }}
          PAN123_PASSWORD: ${{ github.event.inputs.password }}
          PAN123_TOKEN: ${{ secrets.PAN123_TOKEN }}

      - name: Commit mirrored index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: mirror new files to 123pan"
          file_pattern: |
            public/index.json
            public/.mirrored.json