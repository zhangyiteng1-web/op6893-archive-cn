<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>获取123云盘Token</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background: #050814;
      color: #eef7ff;
      padding: 24px;
      min-height: 100vh;
    }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 6px; color: #62f7ff; }
    .sub { color: #7e97ad; margin-bottom: 24px; font-size: 0.9rem; }
    .form {
      background: rgba(12,23,51,0.85);
      border: 1px solid rgba(126,239,255,0.2);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .form label { display: block; color: #8ea4ba; font-size: 0.82rem; margin-bottom: 6px; margin-top: 14px; font-weight: 800; }
    .form label:first-child { margin-top: 0; }
    .form input {
      width: 100%; padding: 14px;
      border: 1px solid rgba(98,247,255,0.25);
      border-radius: 12px;
      background: rgba(0,0,0,0.45);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      outline: none;
    }
    .form input:focus { border-color: #62f7ff; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #00e5ff, #7c3aed);
      color: #fff;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      background: rgba(0,255,163,0.08);
      border: 1px solid rgba(0,255,163,0.3);
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      word-break: break-all;
    }
    .result .label { color: #00ffa3; font-size: 0.8rem; font-weight: 900; margin-bottom: 8px; }
    .result .token { font-family: monospace; font-size: 0.72rem; color: #fff; line-height: 1.5; }
    .error { color: #ff5a78; margin-top: 10px; font-size: 0.9rem; }
    .info { color: #ffd166; margin-top: 10px; font-size: 0.9rem; }
    .copy-btn {
      display: inline-block;
      padding: 10px 20px;
      margin-top: 12px;
      border: 1px solid rgba(0,255,163,0.5);
      border-radius: 10px;
      background: rgba(0,255,163,0.12);
      color: #00ffa3;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .note {
      background: rgba(255,209,102,0.08);
      border: 1px solid rgba(255,209,102,0.2);
      border-radius: 14px;
      padding: 16px;
      margin-top: 16px;
      color: #9fb2c5;
      font-size: 0.85rem;
      line-height: 1.7;
    }
    hr { border: none; border-top: 1px solid rgba(126,239,255,0.1); margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>获取123云盘Token</h1>
    <p class="sub">此页面从你的浏览器直接调用123云盘登录API，不会经过第三方服务器</p>

    <div class="form">
      <label>123云盘手机号</label>
      <input id="phone" type="tel" placeholder="输入手机号">
      <label>123云盘密码</label>
      <input id="password" type="password" placeholder="输入密码">
      <button class="btn" id="loginBtn" onclick="doLogin()">登录并获取Token</button>
      <div id="result"></div>
    </div>

    <div class="note">
      <strong style="color:#ffd166;">原理：</strong>你的手机浏览器在国内，直接调用123云盘API不会触发境外IP拦截。拿到Token后存入GitHub Secrets，GitHub Actions就能用Token直接访问了。
    </div>

    <hr>

    <div class="note">
      <strong style="color:#ffd166;">拿到Token后：</strong><br>
      GitHub → Settings → Secrets → Actions → 新建 <code>PAN123_TOKEN</code>，粘贴Token → 触发 "Mirror to 123pan" workflow
    </div>
  </div>

  <script>
    async function doLogin() {
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');
      const result = document.getElementById('result');

      if (!phone || !password) {
        result.innerHTML = '<div class="error">请填写手机号和密码</div>';
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';
      result.innerHTML = '<div class="info">正在调用123云盘登录API...</div>';

      try {
        const res = await fetch('/api/123pan-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            remember: true,
            passport: phone,
            password: password
          })
        });

        const json = await res.json();

        if (json.code === 200 && json.data && json.data.token) {
          const token = json.data.token;
          // Copy to clipboard
          try {
            await navigator.clipboard.writeText(token);
            result.innerHTML = `
              <div class="result">
                <div class="label">✓ 登录成功！Token已自动复制到剪贴板</div>
                <div class="token">${token}</div>
              </div>
              <button class="copy-btn" onclick="navigator.clipboard.writeText('${token.replace(/'/g, "\\'")}')">再次复制</button>
            `;
          } catch {
            result.innerHTML = `
              <div class="result">
                <div class="label">✓ 登录成功！长按下方Token复制</div>
                <div class="token">${token}</div>
              </div>
            `;
          }
        } else if (json.code === 401 || (json.message && json.message.includes('验证'))) {
          result.innerHTML = `<div class="error">需要验证码：${json.message || ''}<br>请先在浏览器中打开 yun.123pan.cn 登录一次，再回来重试。</div>`;
        } else {
          result.innerHTML = `<div class="error">登录失败：code=${json.code} ${json.message || ''}</div>`;
        }
      } catch (err) {
        result.innerHTML = `<div class="error">网络错误：${err.message}<br>请检查网络连接后重试</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '登录并获取Token';
      }
    }
  </script>
</body>
</html>
